basePath: /v1/api
definitions:
  entity.Alert:
    properties:
      created_at:
        type: string
      details:
        type: string
      id:
        type: integer
      severity:
        $ref: '#/definitions/entity.Severity'
      status:
        $ref: '#/definitions/entity.AlertStatus'
      target_id:
        type: string
    type: object
  entity.AlertStatus:
    enum:
    - sent
    - cooldown
    - not_sent
    type: string
    x-enum-varnames:
    - AlertStatusSent
    - AlertStatusCooldown
    - AlertStatusNotSent
  entity.ContainerEvent:
    properties:
      created_at:
        type: string
      details:
        type: string
      event:
        $ref: '#/definitions/entity.EventType'
      id:
        type: integer
      target_id:
        type: string
    type: object
  entity.EventType:
    enum:
    - die
    - oom
    - kill
    - restart
    - destroy
    - start
    type: string
    x-enum-varnames:
    - ContainerDie
    - ContainerOOM
    - ContainerKill
    - ContainerRestart
    - ContainerDestroy
    - ContainerStart
  entity.HostMetric:
    properties:
      level:
        type: string
      percent:
        type: number
      total:
        type: integer
      used:
        type: integer
    type: object
  entity.HostSnapshot:
    properties:
      cpu:
        $ref: '#/definitions/entity.HostMetric'
      disk:
        $ref: '#/definitions/entity.HostMetric'
      hostname:
        type: string
      memory:
        $ref: '#/definitions/entity.HostMetric'
      sampled_at:
        type: string
    type: object
  entity.LogMatch:
    properties:
      created_at:
        type: string
      id:
        type: integer
      message:
        type: string
      severity:
        $ref: '#/definitions/entity.Severity'
      target_id:
        type: string
    type: object
  entity.Probe:
    properties:
      created_at:
        type: string
      id:
        type: integer
      latency:
        type: integer
      success:
        type: boolean
      target_id:
        type: string
    type: object
  entity.Severity:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    type: integer
    x-enum-varnames:
    - SeverityCritical
    - SeverityError
    - SeverityWarning
    - SeverityInfo
    - SeverityDebug
  entity.Target:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      source:
        type: string
      status:
        type: string
      target_type:
        type: string
      updated_at:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: API for monitoring containers and HTTP targets.
  title: Argus API
  version: "1.0"
paths:
  /alerts:
    get:
      description: Returns alerts; filters can be combined. The total number of matching
        records is in the X-Total-Count header
      parameters:
      - collectionFormat: multi
        description: Target ID, can be repeated
        in: query
        items:
          type: string
        name: target_id
        type: array
      - description: Only host alerts (no target)
        in: query
        name: host
        type: boolean
      - description: Severity
        in: query
        name: severity
        type: integer
      - description: 'Status filter: sent, cooldown, not_sent'
        enum:
        - sent
        - cooldown
        - not_sent
        in: query
        name: status
        type: string
      - description: Not earlier than this moment, RFC 3339
        in: query
        name: since
        type: string
      - description: Order by id
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: How many records to skip
        in: query
        name: skip
        type: integer
      - description: Only records with an id greater than this
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Number of records matching the filter
              type: integer
          schema:
            items:
              $ref: '#/definitions/entity.Alert'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List alerts
      tags:
      - alerts
    post:
      consumes:
      - application/json
      description: Creates a new alert
      parameters:
      - description: Alert data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.Alert'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Alert'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create an alert
      tags:
      - alerts
  /alerts/{id}:
    delete:
      description: Deletes an alert by ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete an alert
      tags:
      - alerts
    get:
      description: Returns an alert by ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Alert'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get an alert
      tags:
      - alerts
  /events:
    get:
      description: Returns events filtered by target/type, or paged
      parameters:
      - description: Target ID
        in: query
        name: target_id
        type: string
      - description: Event type
        in: query
        name: type
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.ContainerEvent'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List events
      tags:
      - events
  /events/{id}:
    delete:
      description: Deletes an event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete an event
      tags:
      - events
    get:
      description: Returns an event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.ContainerEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get an event
      tags:
      - events
  /host:
    get:
      description: Latest sample of CPU, RAM and the root partition. A metric without
        a value is null; before the first sample sampled_at is null
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.HostSnapshot'
      summary: Host resources
      tags:
      - host
  /log-matches:
    get:
      description: Returns log matches; filters can be combined. The total number
        of matching records is in the X-Total-Count header
      parameters:
      - collectionFormat: multi
        description: Target ID, can be repeated
        in: query
        items:
          type: string
        name: target_id
        type: array
      - description: Severity
        in: query
        name: severity
        type: integer
      - description: Not earlier than this moment, RFC 3339
        in: query
        name: since
        type: string
      - description: Order by id
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: How many records to skip
        in: query
        name: skip
        type: integer
      - description: Only records with an id greater than this
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Number of records matching the filter
              type: integer
          schema:
            items:
              $ref: '#/definitions/entity.LogMatch'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List log matches
      tags:
      - log-matches
  /log-matches/{id}:
    delete:
      description: Deletes a log match by ID
      parameters:
      - description: Log match ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete a log match
      tags:
      - log-matches
    get:
      description: Returns a log match by ID
      parameters:
      - description: Log match ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.LogMatch'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get a log match
      tags:
      - log-matches
  /probes:
    get:
      description: Returns probes filtered by target/result, or paged
      parameters:
      - description: Target ID
        in: query
        name: target_id
        type: string
      - description: Whether the probe succeeded
        in: query
        name: success
        type: boolean
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Probe'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List probes
      tags:
      - probes
  /probes/{id}:
    delete:
      description: Deletes a probe by ID
      parameters:
      - description: Probe ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete a probe
      tags:
      - probes
    get:
      description: Returns a probe by ID
      parameters:
      - description: Probe ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Probe'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get a probe
      tags:
      - probes
  /targets:
    get:
      description: Returns targets filtered by type/status, or paged
      parameters:
      - description: Target type
        in: query
        name: type
        type: string
      - description: Target status
        in: query
        name: status
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Target'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: List targets
      tags:
      - targets
    post:
      consumes:
      - application/json
      description: Registers a new target for monitoring
      parameters:
      - description: Target data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/entity.Target'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Create a target
      tags:
      - targets
  /targets/{id}:
    delete:
      description: Deletes a target by ID
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Delete a target
      tags:
      - targets
    get:
      description: Returns a target by ID
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Get a target
      tags:
      - targets
  /targets/{id}/status:
    patch:
      consumes:
      - application/json
      description: Changes the status of an existing target
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          properties:
            status:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Update target status
      tags:
      - targets
swagger: "2.0"
