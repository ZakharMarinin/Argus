env: "local"
http_server:
  addr: 0.0.0.0:8099
  read_timeout: 4s
  write_timeout: 4s
  idle_timeout: 60s
prober:
  probe_timeout: 5s
  probe_interval: 60s
  failure_threshold: 2
watcher:
  crash_loop_restarts: 5
  crash_loop_window: 5m
retention:
  keep: 336h
  interval: 24h
telegram:
  notify_interval: 5s
  cooldown: 5m
matcher:
  rules:
    - pattern: '^\s*panic: |^fatal error: '
      severity: critical
      container: "*"
    - pattern: 'CONFIG env variable not set|cannot find the config|Redis config db value error'
      severity: critical
      container: "*"
    - pattern: '"level":"ERROR","msg":"(failed to (listen|serve)|ListenAndServe( failed)?)"'
      severity: critical
      container: "*"
    - pattern: '"level":"ERROR".*(connection refused|failed to connect|no such host|i/o timeout|context deadline exceeded|code = Unavailable|SQLSTATE (08|42|53|57|58|XX))'
      severity: error
      container: "*"
    - pattern: '\bPANIC: '
      severity: critical
      container: "bernard-postgres"
    - pattern: 'FATAL: +(password authentication failed|sorry, too many clients|remaining connection slots|could not|out of memory)'
      severity: error
      container: "bernard-postgres"
    - pattern: 'ERROR: +(deadlock detected|could not extend file|No space left on device)'
      severity: error
      container: "bernard-postgres"
    - pattern: '(?i)BUG REPORT START|Out Of Memory|Guru Meditation'
      severity: critical
      container: "bernard-valkey"
    - pattern: 'Background saving error|Failed opening the temp RDB|Write error saving DB|MISCONF|Short read or OOM loading DB'
      severity: error
      container: "bernard-valkey"
host:
  interval: 15s
  disk_path: /
  warning: 90
  critical: 95
  consecutive: 3
