services:
  argus-postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - db
    volumes:
      - argus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 20

  argus:
    build: .
    env_file: .env
    container_name: argus-coolector
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - db
    security_opt:
      - "label=disable"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      argus-postgres:
        condition: service_healthy

networks:
  db:
    internal: true

volumes:
  argus_postgres_data:
    name: argus_postgres_data
