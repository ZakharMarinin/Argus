# Конфиг дашборда Argus.
#
# web - чистый HTTP-клиент argus-backend: он не подключается к Postgres и
# не знает про DSN, миграции или права ролей (это забота argus-backend,
# см. ../argus-backend/config.yaml).

backend:
  # Адрес HTTP API argus-backend. Переменная ARGUS_BACKEND_URL (из окружения
  # или из .env рядом с go.mod) перекрывает значение отсюда.
  base_url: ""

  # Таймаут HTTP-запросов к бэкенду.
  timeout_seconds: 5

web:
  listen_addr: ":8088"

  # Каталог web/ для разработки: шаблоны и статика читаются с диска, а не из
  # бинарника. В проде оставить пустым — тогда всё берётся из go:embed.
  template_dir: ""

  # Сколько дней бэкенд хранит историю (собственная настройка ретеншна
  # коллектора, продублированная здесь только для отображения на странице
  # алертов).
  retention_days: 14
