# Argus dashboard config.
#
# web is a pure HTTP client of argus-backend: it doesn't connect to Postgres
# and knows nothing about DSNs, migrations or role permissions (that's
# argus-backend's job, see ../argus-backend/config.yaml).

backend:
  # argus-backend HTTP API address. The ARGUS_BACKEND_URL variable (from the
  # environment or from .env in the current working directory) overrides it.
  base_url: ""

  # Timeout for HTTP requests to the backend.
  timeout_seconds: 5

web:
  listen_addr: ":8088"

  # web/ directory for development: templates and static files are read from
  # disk instead of the binary. Leave empty in production, then everything comes from go:embed.
  template_dir: ""

  # How many days the backend keeps history (the collector's own retention
  # setting, duplicated here only for display on the alerts page).
  retention_days: 14
